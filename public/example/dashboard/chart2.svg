<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <style>
            .axis {
                stroke: #e0e0e0;
                stroke-width: 1.5;
            }

            .grid-line {
                stroke: #f0f0f0;
                stroke-width: 1;
                fill: none;
            }

            .label {
                font-family: Arial, sans-serif;
                font-size: 12px;
                fill: #666;
                text-anchor: middle;
            }

            .legend-text {
                font-family: Arial, sans-serif;
                font-size: 14px;
                fill: #333;
            }
        </style>
    </defs>

    <!-- Background -->
    <!-- <rect width="600" height="500" fill="#ffffff" /> -->

    <!-- Chart Title -->
    <text x="250" y="40" class="label" font-size="16" font-weight="bold">GitHub Repository Activity</text>

    <!-- Polar Grid -->
    <g transform="translate(250, 250)">
        <!-- Concentric circles for grid -->
        <circle cx="0" cy="0" r="20" class="grid-line" />
        <circle cx="0" cy="0" r="40" class="grid-line" />
        <circle cx="0" cy="0" r="60" class="grid-line" />
        <circle cx="0" cy="0" r="80" class="grid-line" />
        <circle cx="0" cy="0" r="100" class="grid-line" />
        <circle cx="0" cy="0" r="120" class="grid-line" />

        <!-- Axis lines -->
        <line x1="0" y1="-120" x2="0" y2="120" class="axis" />
        <line x1="-120" y1="0" x2="120" y2="0" class="axis" />

        <!-- Scale labels -->
        <text x="5" y="-20" class="label">5</text>
        <text x="5" y="-40" class="label">10</text>
        <text x="5" y="-60" class="label">15</text>
        <text x="5" y="-80" class="label">20</text>
        <text x="5" y="-100" class="label">25</text>
        <text x="5" y="-120" class="label">30</text>
    </g>

    <!-- Data Visualization -->
    <g transform="translate(250, 250)">
        <!-- API (Light Blue) - Top Right Quadrant -->
        <path d="M 0 0 L 0 -50 A 50 50 0 0 1 50 0 Z" fill="#a8d4ff" stroke="#7ab3e0" stroke-width="2" />

        <!-- Backend (Medium Blue) - Bottom Right Quadrant -->
        <path d="M 0 0 L 70 0 A 70 70 0 0 1 0 70 Z" fill="#8bb8e0" stroke="#5a9bc4" stroke-width="2" />

        <!-- Frontend (Dark Blue) - Bottom Left Quadrant -->
        <path d="M 0 0 L 0 80 A 80 80 0 0 1 -80 0 Z" fill="#7aa3c9" stroke="#4a85b0" stroke-width="2" />

        <!-- Issues (Very Dark Blue) - Top Left Quadrant -->
        <path d="M 0 0 L -90 0 A 90 90 0 0 1 0 -90 Z" fill="#6a8faa" stroke="#3a7595" stroke-width="2" />
    </g>

    <!-- Legend -->
    <g transform="translate(100, 420)">
        <circle cx="0" cy="0" r="6" fill="#a8d4ff" />
        <text x="15" y="4" class="legend-text">API</text>

        <circle cx="70" cy="0" r="6" fill="#8bb8e0" />
        <text x="85" y="4" class="legend-text">Backend</text>

        <circle cx="150" cy="0" r="6" fill="#7aa3c9" />
        <text x="165" y="4" class="legend-text">Frontend</text>

        <circle cx="240" cy="0" r="6" fill="#6a8faa" />
        <text x="255" y="4" class="legend-text">Issues</text>
    </g>
</svg>