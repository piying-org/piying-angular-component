<ng-template #templateRef let-attr="attributes">
  <ion-menu
    [contentId]="contentId()"
    [menuId]="menuId()"
    [type]="type()"
    [disabled]="disabled()"
    [side]="side()"
    [swipeGesture]="swipeGesture()"
    [maxEdgeStart]="maxEdgeStart()"
    (ionWillOpen)="ionWillOpen.emit($event)"
    (ionWillClose)="ionWillClose.emit($event)"
    (ionDidOpen)="ionDidOpen.emit($event)"
    (ionDidClose)="ionDidClose.emit($event)"
    [class]="attr()?.class"
    [attributes]="attr()"
    [excludes]="['class']"
  >
    @for (field of children$$(); track $index) {
      <ng-container
        *ngTemplateOutlet="fieldTemplateRef; context: { $implicit: field }"
      ></ng-container>
    }
  </ion-menu>
</ng-template>
