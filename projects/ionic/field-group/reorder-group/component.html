<ng-template #templateRef let-attr="attributes">
  <ion-reorder-group
    [disabled]="disabled()"
    (ionItemReorder)="ionItemReorder.emit($event)"
    (ionReorderStart)="ionReorderStart.emit($event)"
    (ionReorderMove)="ionReorderMove.emit($event)"
    (ionReorderEnd)="ionReorderEnd.emit($event)"
    [class]="attr()?.class"
    [attributes]="attr()"
    [excludes]="['class']"
  ></ion-reorder-group>
</ng-template>
