<ng-template #templateRef let-attr="attributes">
  <ion-item-sliding
    [disabled]="disabled()"
    (ionDrag)="ionDrag.emit($event)"
    [class]="attr()?.class"
    [attributes]="attr()"
    [excludes]="['class']"
    ><ng-container *ngTemplateOutlet="slot()"></ng-container
  ></ion-item-sliding>
</ng-template>
