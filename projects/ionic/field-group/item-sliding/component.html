<ng-template #templateRef let-attr="attributes">
  <ion-item-sliding
    [disabled]="disabled()"
    (ionDrag)="ionDrag($event)"
    [class]="attr()?.class"
    [attributes]="attr()"
    [excludes]="['class']"
    ><ng-container *ngTemplateOutlet="slot()?.default" ngProjectAs="default"></ng-container
  ></ion-item-sliding>
</ng-template>
