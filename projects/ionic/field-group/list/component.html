<ng-template #templateRef let-attr="attributes">
  <ion-list
    [lines]="lines()"
    [inset]="inset()"
    [mode]="mode()"
    [class]="attr()?.class"
    [attributes]="attr()"
    [excludes]="['class']"
  >
    @if (title$$()) {
      <ion-list-header [property]="headerProperty()">
        <ion-label>{{ title$$() }}</ion-label>
      </ion-list-header>
    }
    @if (itemWrapper()) {
      @for (field of children$$(); track $index) {
        <ion-item>
          <ng-container
            *ngTemplateOutlet="fieldTemplateRef; context: { $implicit: field }"
          ></ng-container>
        </ion-item>
      }
    } @else {
      @for (field of children$$(); track $index) {
        <ng-container
          *ngTemplateOutlet="fieldTemplateRef; context: { $implicit: field }"
        ></ng-container>
      }
    }
  </ion-list>
</ng-template>
