<ng-template #templateRef let-attr="attributes">
  <ion-accordion
    [value]="value()"
    [disabled]="disabled()"
    [readonly]="readonly()"
    [toggleIcon]="toggleIcon()"
    [toggleIconSlot]="toggleIconSlot()"
    [class]="attr()?.class"
    [attributes]="attr()"
    [excludes]="['class']"
    ><ng-container *ngTemplateOutlet="slot()"></ng-container
  ></ion-accordion>
</ng-template>
