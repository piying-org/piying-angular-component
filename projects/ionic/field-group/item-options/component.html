<ng-template #templateRef let-attr="attributes">
  <ion-item-options
    [side]="side()"
    (ionSwipe)="ionSwipe.emit($event)"
    [class]="attr()?.class"
    [attributes]="attr()"
    [excludes]="['class']"
    ><ng-container *ngTemplateOutlet="slot()"></ng-container
  ></ion-item-options>
</ng-template>
