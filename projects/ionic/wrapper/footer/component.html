<ng-template #templateRef let-attr="attributes">
  <ion-footer
    [collapse]="props()?.collapse"
    [translucent]="props()?.translucent"
    [mode]="props()?.mode"
    [class]="attr()?.class"
    [attributes]="attr()"
    [excludes]="['class']"
    ><ng-container insertField></ng-container
  ></ion-footer>
</ng-template>
