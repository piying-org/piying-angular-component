<ng-template #slot>
  <ion-input-password-toggle
    slot="end"
    [color]="props()?.color"
    [showIcon]="props()?.showIcon"
    [hideIcon]="props()?.hideIcon"
    [mode]="props()?.mode"
  ></ion-input-password-toggle>
</ng-template>
<ng-template #templateRef>
  <ng-container insertField></ng-container>
</ng-template>
