<ng-template #templateRef let-attr="attributes">
  <ion-col
    [offset]="props()?.offset"
    [offsetXs]="props()?.offsetXs"
    [offsetSm]="props()?.offsetSm"
    [offsetMd]="props()?.offsetMd"
    [offsetLg]="props()?.offsetLg"
    [offsetXl]="props()?.offsetXl"
    [pull]="props()?.pull"
    [pullXs]="props()?.pullXs"
    [pullSm]="props()?.pullSm"
    [pullMd]="props()?.pullMd"
    [pullLg]="props()?.pullLg"
    [pullXl]="props()?.pullXl"
    [push]="props()?.push"
    [pushXs]="props()?.pushXs"
    [pushSm]="props()?.pushSm"
    [pushMd]="props()?.pushMd"
    [pushLg]="props()?.pushLg"
    [pushXl]="props()?.pushXl"
    [size]="props()?.size"
    [sizeXs]="props()?.sizeXs"
    [sizeSm]="props()?.sizeSm"
    [sizeMd]="props()?.sizeMd"
    [sizeLg]="props()?.sizeLg"
    [sizeXl]="props()?.sizeXl"
    [class]="attr()?.class"
    [attributes]="attr()"
    [excludes]="['class']"
    ><ng-container insertField></ng-container
  ></ion-col>
</ng-template>
