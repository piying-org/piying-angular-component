<ng-template #templateRef let-attr="attributes">
  <ion-input-password-toggle
    [color]="color()"
    [showIcon]="showIcon()"
    [hideIcon]="hideIcon()"
    [mode]="mode()"
    [class]="attr()?.class"
    [attributes]="attr()"
    [excludes]="['class']"
    [ngModel]="value$()"
    (ngModelChange)="valueChange($event)"
    (blur)="touchedChange()"
    [disabled]="disabled$()"
  ></ion-input-password-toggle>
</ng-template>
