<ng-template #templateRef let-attr="attributes">
  <ion-datetime
    [color]="color()"
    [name]="name()!"
    [formatOptions]="formatOptions()"
    [readonly]="readonly()"
    [isDateEnabled]="isDateEnabled()"
    [showAdjacentDays]="showAdjacentDays()"
    [min]="min()"
    [max]="max()"
    [presentation]="presentation()"
    [yearValues]="yearValues()"
    [monthValues]="monthValues()"
    [dayValues]="dayValues()"
    [hourValues]="hourValues()"
    [minuteValues]="minuteValues()"
    [locale]="locale()"
    [firstDayOfWeek]="firstDayOfWeek()"
    [titleSelectedDatesFormatter]="titleSelectedDatesFormatter()"
    [multiple]="multiple()"
    [highlightedDates]="highlightedDates()"
    [value]="value()"
    [showDefaultTitle]="showDefaultTitle()"
    [showDefaultButtons]="showDefaultButtons()"
    [showClearButton]="showClearButton()"
    [showDefaultTimeLabel]="showDefaultTimeLabel()"
    [hourCycle]="hourCycle()"
    [size]="size()"
    [preferWheel]="preferWheel()"
    (ionCancel)="ionCancel.emit($event)"
    (ionChange)="ionChange.emit($event)"
    (ionFocus)="ionFocus.emit($event)"
    (ionBlur)="ionBlur.emit($event)"
    [class]="attr()?.class"
    [attributes]="attr()"
    [excludes]="['class']"
    [ngModel]="value$()"
    (ngModelChange)="valueChange($event)"
    (blur)="touchedChange()"
    [disabled]="disabled$()"
  >
    <ng-container *ngTemplateOutlet="slot()"></ng-container
  ></ion-datetime>
</ng-template>
