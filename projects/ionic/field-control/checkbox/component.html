<ng-template #templateRef let-attr="attributes">
  <ion-checkbox
    [color]="color()"
    [name]="name()!"
    [checked]="checked()"
    [indeterminate]="indeterminate()"
    [errorText]="errorText()"
    [helperText]="helperText()"
    [labelPlacement]="labelPlacement()"
    [justify]="justify()"
    [required]="required()!"
    (ionChange)="ionChange.emit($event)"
    (ionFocus)="ionFocus.emit($event)"
    (ionBlur)="ionBlur.emit($event)"
    [class]="attr()?.class"
    [attributes]="attr()"
    [excludes]="['class']"
    [ngModel]="value$()"
    (ngModelChange)="valueChange($event)"
    (blur)="touchedChange()"
    [disabled]="disabled$()"
  >
    <ng-template
      [selectlessOutlet]="StrOrTemplateComponent"
      [selectlessOutletInputs]="{ content: label() }"
    ></ng-template>
  </ion-checkbox>
</ng-template>
