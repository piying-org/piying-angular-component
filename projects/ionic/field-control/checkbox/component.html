<ng-template #templateRef let-attr="attributes">
  <ion-checkbox
    [color]="color()"
    [name]="name()"
    [checked]="checked()"
    [indeterminate]="indeterminate()"
    [errorText]="errorText()"
    [helperText]="helperText()"
    [value]="value()"
    [labelPlacement]="labelPlacement()"
    [justify]="justify()"
    [alignment]="alignment()"
    [required]="required()"
    (ionChange)="ionChange.emit($event)"
    (ionFocus)="ionFocus.emit($event)"
    (ionBlur)="ionBlur.emit($event)"
    [class]="attr()?.class"
    [attributes]="attr()"
    [excludes]="['class']"
    [ngModel]="value$()"
    (ngModelChange)="valueChange($event)"
    (blur)="touchedChange()"
    [disabled]="disabled$()"
  ></ion-checkbox>
</ng-template>
