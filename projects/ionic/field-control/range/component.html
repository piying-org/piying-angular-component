<ng-template #templateRef let-attr="attributes">
  <ion-range
    [color]="color()"
    [debounce]="debounce()"
    [name]="name()!"
    [label]="label()"
    [dualKnobs]="dualKnobs()"
    [min]="min()"
    [max]="max()"
    [pin]="pin()"
    [pinFormatter]="pinFormatter()"
    [snaps]="snaps()"
    [step]="step()"
    [ticks]="ticks()"
    [activeBarStart]="activeBarStart()"
    [value]="value()"
    [labelPlacement]="labelPlacement()"
    (ionChange)="ionChange.emit($event)"
    (ionInput)="ionInput.emit($event)"
    (ionFocus)="ionFocus.emit($event)"
    (ionBlur)="ionBlur.emit($event)"
    (ionKnobMoveStart)="ionKnobMoveStart.emit($event)"
    (ionKnobMoveEnd)="ionKnobMoveEnd.emit($event)"
    [class]="attr()?.class"
    [attributes]="attr()"
    [excludes]="['class']"
    [ngModel]="value$()"
    (ngModelChange)="valueChange($event)"
    (blur)="touchedChange()"
    [disabled]="disabled$()"
    ><ng-container *ngTemplateOutlet="slot()"></ng-container
  ></ion-range>
</ng-template>
