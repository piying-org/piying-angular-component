<ng-template #templateRef let-attr="attributes">
  <ion-toggle
    [color]="color()"
    [name]="name()!"
    [checked]="checked()"
    [errorText]="errorText()"
    [helperText]="helperText()"
    [value]="value()"
    [enableOnOffLabels]="enableOnOffLabels()"
    [labelPlacement]="labelPlacement()"
    [justify]="justify()"
    [required]="required()!"
    (ionChange)="ionChange.emit($event)"
    (ionFocus)="ionFocus.emit($event)"
    (ionBlur)="ionBlur.emit($event)"
    [class]="attr()?.class"
    [attributes]="attr()"
    [excludes]="['class']"
    [ngModel]="value$()"
    (ngModelChange)="valueChange($event)"
    (blur)="touchedChange()"
    [disabled]="disabled$()"
    ><ng-container *ngTemplateOutlet="slot()"></ng-container
  ></ion-toggle>
</ng-template>
