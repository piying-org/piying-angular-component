<ng-template #templateRef let-attr="attributes">
  <ion-select
    [cancelText]="cancelText()"
    [color]="color()"
    [compareWith]="compareWith()"
    [fill]="fill()"
    [errorText]="errorText()"
    [helperText]="helperText()"
    [interface]="interface()"
    [interfaceOptions]="interfaceOptions()"
    [justify]="justify()"
    [label]="label()"
    [labelPlacement]="labelPlacement()"
    [multiple]="multiple()"
    [name]="name()!"
    [okText]="okText()"
    [placeholder]="placeholder()"
    [selectedText]="selectedText()"
    [toggleIcon]="toggleIcon()"
    [expandedIcon]="expandedIcon()"
    [shape]="shape()"
    [value]="value()"
    (ionChange)="onIonChange.emit($event)"
    (ionCancel)="onIonCancel.emit($event)"
    (ionDismiss)="onIonDismiss.emit($event)"
    (ionFocus)="onIonFocus.emit($event)"
    (ionBlur)="onIonBlur.emit($event)"
    [class]="attr()?.class"
    [attributes]="attr()"
    [excludes]="['class']"
    [ngModel]="value$()"
    (ngModelChange)="valueChange($event)"
    (blur)="touchedChange()"
    [disabled]="disabled$()"
  >
    @for (item of resolvedOptions$$(); track $index) {
      <ion-select-option [value]="item.value" [disabled]="!!item.disabled">
        @let optionTemplate = optionTemplate$$();
        @if (optionTemplate) {
          <ng-container
            *ngTemplateOutlet="optionTemplate; context: { template: item }"
          ></ng-container>
        } @else {
          {{ item.label }}
        }
      </ion-select-option>
    }
  </ion-select>
</ng-template>
