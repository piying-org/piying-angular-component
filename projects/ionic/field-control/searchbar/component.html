<ng-template #templateRef let-attr="attributes">
  <ion-searchbar
    [color]="color()"
    [animated]="animated()"
    [autocapitalize]="autocapitalize()"
    [autocomplete]="autocomplete()"
    [autocorrect]="autocorrect()"
    [cancelButtonIcon]="cancelButtonIcon()"
    [cancelButtonText]="cancelButtonText()"
    [clearIcon]="clearIcon()"
    [debounce]="debounce()"
    [disabled]="disabled()"
    [inputmode]="inputmode()"
    [enterkeyhint]="enterkeyhint()"
    [maxlength]="maxlength()"
    [minlength]="minlength()"
    [name]="name()"
    [placeholder]="placeholder()"
    [searchIcon]="searchIcon()"
    [showCancelButton]="showCancelButton()"
    [showClearButton]="showClearButton()"
    [spellcheck]="spellcheck()"
    [type]="type()"
    [value]="value()"
    (ionInput)="ionInput($event)"
    (ionChange)="ionChange($event)"
    (ionCancel)="ionCancel($event)"
    (ionClear)="ionClear($event)"
    (ionBlur)="ionBlur($event)"
    (ionFocus)="ionFocus($event)"
    (ionStyle)="ionStyle($event)"
    [class]="attr()?.class"
    [attributes]="attr()"
    [excludes]="['class']"
    [ngModel]="value$()"
    (ngModelChange)="valueChange($event)"
    (blur)="touchedChange()"
    [disabled]="disabled$()"
  ></ion-searchbar>
</ng-template>
