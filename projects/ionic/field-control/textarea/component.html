<ng-template #templateRef let-attr="attributes">
  <ion-textarea
    [color]="color()"
    [autocapitalize]="autocapitalize()"
    [autofocus]="autofocus()"
    [clearOnEdit]="clearOnEdit()"
    [debounce]="debounce()"
    [disabled]="disabled()"
    [fill]="fill()"
    [inputmode]="inputmode()"
    [enterkeyhint]="enterkeyhint()"
    [maxlength]="maxlength()"
    [minlength]="minlength()"
    [name]="name()"
    [placeholder]="placeholder()"
    [readonly]="readonly()"
    [required]="required()"
    [spellcheck]="spellcheck()"
    [cols]="cols()"
    [rows]="rows()"
    [wrap]="wrap()"
    [autoGrow]="autoGrow()"
    [value]="value()"
    [counter]="counter()"
    [counterFormatter]="counterFormatter()"
    [errorText]="errorText()"
    [helperText]="helperText()"
    [label]="label()"
    [labelPlacement]="labelPlacement()"
    [shape]="shape()"
    (ionChange)="ionChange.emit($event)"
    (ionInput)="ionInput.emit($event)"
    (ionBlur)="ionBlur.emit($event)"
    (ionFocus)="ionFocus.emit($event)"
    [class]="attr()?.class"
    [attributes]="attr()"
    [excludes]="['class']"
    [ngModel]="value$()"
    (ngModelChange)="valueChange($event)"
    (blur)="touchedChange()"
    [disabled]="disabled$()"
    ><ng-container *ngTemplateOutlet="slot()?.label" ngProjectAs="label"></ng-container>
    <ng-container *ngTemplateOutlet="slot()?.start" ngProjectAs="start"></ng-container>
    <ng-container *ngTemplateOutlet="slot()?.end" ngProjectAs="end"></ng-container
  ></ion-textarea>
</ng-template>
