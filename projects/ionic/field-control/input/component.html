<ng-template #templateRef let-attr="attributes">
  <ion-input
    [color]="color()"
    [autocapitalize]="autocapitalize()"
    [autocomplete]="autocomplete()"
    [autocorrect]="autocorrect()"
    [autofocus]="autofocus()"
    [clearInput]="clearInput()"
    [clearOnEdit]="clearOnEdit()"
    [counter]="counter()"
    [counterFormatter]="counterFormatter()"
    [debounce]="debounce()"
    [enterkeyhint]="enterkeyhint()"
    [errorText]="errorText()"
    [fill]="fill()"
    [inputmode]="inputmode()"
    [helperText]="helperText()"
    [label]="label()"
    [labelPlacement]="labelPlacement()"
    [max]="max()"
    [maxlength]="maxlength()!"
    [min]="min()"
    [minlength]="minlength()!"
    [multiple]="multiple()"
    [name]="name()!"
    [pattern]="pattern()!"
    [placeholder]="placeholder()"
    [readonly]="readonly()"
    [required]="required()!"
    [shape]="shape()"
    [spellcheck]="spellcheck()"
    [step]="step()"
    [type]="type()"
    [value]="value()"
    (ionInput)="ionInput.emit($event)"
    (ionChange)="ionChange.emit($event)"
    (ionBlur)="ionBlur.emit($event)"
    (ionFocus)="ionFocus.emit($event)"
    [class]="attr()?.class"
    [attributes]="attr()"
    [excludes]="['class']"
    [ngModel]="value$()"
    (ngModelChange)="valueChange($event)"
    (blur)="touchedChange()"
    [disabled]="disabled$()"
    ><ng-container *ngTemplateOutlet="slot()"></ng-container
  ></ion-input>
</ng-template>
