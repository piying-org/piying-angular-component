<ng-template #templateRef let-attr="attributes">
  <ion-input
    [color]="color()"
    [autocapitalize]="autocapitalize()"
    [autocomplete]="autocomplete()"
    [autocorrect]="autocorrect()"
    [autofocus]="autofocus()"
    [clearInput]="clearInput()"
    [clearInputIcon]="clearInputIcon()"
    [clearOnEdit]="clearOnEdit()"
    [counter]="counter()"
    [counterFormatter]="counterFormatter()"
    [debounce]="debounce()"
    [disabled]="disabled()"
    [enterkeyhint]="enterkeyhint()"
    [errorText]="errorText()"
    [fill]="fill()"
    [inputmode]="inputmode()"
    [helperText]="helperText()"
    [label]="label()"
    [labelPlacement]="labelPlacement()"
    [max]="max()"
    [maxlength]="maxlength()"
    [min]="min()"
    [minlength]="minlength()"
    [multiple]="multiple()"
    [name]="name()"
    [pattern]="pattern()"
    [placeholder]="placeholder()"
    [readonly]="readonly()"
    [required]="required()"
    [shape]="shape()"
    [spellcheck]="spellcheck()"
    [step]="step()"
    [type]="type()"
    [value]="value()"
    (ionInput)="ionInput($event)"
    (ionChange)="ionChange($event)"
    (ionBlur)="ionBlur($event)"
    (ionFocus)="ionFocus($event)"
    [class]="attr()?.class"
    [attributes]="attr()"
    [excludes]="['class']"
    [ngModel]="value$()"
    (ngModelChange)="valueChange($event)"
    (blur)="touchedChange()"
    [disabled]="disabled$()"
    ><ng-container *ngTemplateOutlet="slot().label" ngProjectAs="label"></ng-container>
    <ng-container *ngTemplateOutlet="slot().start" ngProjectAs="start"></ng-container>
    <ng-container *ngTemplateOutlet="slot().end" ngProjectAs="end"></ng-container
  ></ion-input>
</ng-template>
