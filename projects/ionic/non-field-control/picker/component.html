<ng-template #templateRef let-attr="attributes">
  <ion-picker
    (ionInputModeChange)="ionInputModeChange.emit($event)"
    [class]="attr()?.class"
    [attributes]="attr()"
    [excludes]="['class']"
    ><ng-container *ngTemplateOutlet="slot()?.default" ngProjectAs="default"></ng-container
  ></ion-picker>
</ng-template>
