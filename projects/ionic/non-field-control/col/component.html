<ng-template #templateRef let-attr="attributes">
  <ion-col
    [offset]="offset()"
    [offsetXs]="offsetXs()"
    [offsetSm]="offsetSm()"
    [offsetMd]="offsetMd()"
    [offsetLg]="offsetLg()"
    [offsetXl]="offsetXl()"
    [pull]="pull()"
    [pullXs]="pullXs()"
    [pullSm]="pullSm()"
    [pullMd]="pullMd()"
    [pullLg]="pullLg()"
    [pullXl]="pullXl()"
    [push]="push()"
    [pushXs]="pushXs()"
    [pushSm]="pushSm()"
    [pushMd]="pushMd()"
    [pushLg]="pushLg()"
    [pushXl]="pushXl()"
    [size]="size()"
    [sizeXs]="sizeXs()"
    [sizeSm]="sizeSm()"
    [sizeMd]="sizeMd()"
    [sizeLg]="sizeLg()"
    [sizeXl]="sizeXl()"
    [class]="attr()?.class"
    [attributes]="attr()"
    [excludes]="['class']"
    ><ng-container *ngTemplateOutlet="slot()?.default" ngProjectAs="default"></ng-container
  ></ion-col>
</ng-template>
