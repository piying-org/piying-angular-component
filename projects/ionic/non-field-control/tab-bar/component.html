<ng-template #templateRef let-attr="attributes">
  <ion-tab-bar
    [color]="color()"
    [selectedTab]="selectedTab()"
    [translucent]="translucent()"
    (ionTabBarChanged)="ionTabBarChanged.emit($event)"
    (ionTabBarLoaded)="ionTabBarLoaded.emit($event)"
    [class]="attr()?.class"
    [attributes]="attr()"
    [excludes]="['class']"
  ></ion-tab-bar>
</ng-template>
