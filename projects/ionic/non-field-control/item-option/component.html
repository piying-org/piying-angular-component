<ng-template #templateRef let-attr="attributes">
  <ion-item-option
    [color]="color()"
    [disabled]="disabled()"
    [download]="download()"
    [expandable]="expandable()"
    [href]="href()"
    [rel]="rel()"
    [target]="target()"
    [type]="type()"
    [class]="attr()?.class"
    [attributes]="attr()"
    [excludes]="['class']"
    ><ng-container *ngTemplateOutlet="slot()"></ng-container
  ></ion-item-option>
</ng-template>
