<ng-template #templateRef let-attr="attributes">
  <ion-router
    [root]="root()"
    [useHash]="useHash()"
    (ionRouteWillChange)="ionRouteWillChange.emit($event)"
    (ionRouteDidChange)="ionRouteDidChange.emit($event)"
    [class]="attr()?.class"
    [attributes]="attr()"
    [excludes]="['class']"
  ></ion-router>
</ng-template>
