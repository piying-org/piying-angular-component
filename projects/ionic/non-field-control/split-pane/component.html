<ng-template #templateRef let-attr="attributes">
  <ion-split-pane
    [contentId]="contentId()"
    [disabled]="disabled()"
    [when]="when()"
    (ionSplitPaneVisible)="ionSplitPaneVisible.emit($event)"
    [class]="attr()?.class"
    [attributes]="attr()"
    [excludes]="['class']"
    ><ng-container *ngTemplateOutlet="slot()?.default" ngProjectAs="default"></ng-container
  ></ion-split-pane>
</ng-template>
