<ng-template #templateRef let-attr="attributes">
  <ion-item
    [button]="button()"
    [detail]="detail()"
    [detailIcon]="detailIcon()"
    [disabled]="disabled()"
    [download]="download()"
    [href]="href()"
    [rel]="rel()"
    [lines]="lines()"
    [routerAnimation]="routerAnimation()"
    [routerDirection]="routerDirection()"
    [target]="target()"
    [type]="type()"
    [class]="attr()?.class"
    [attributes]="attr()"
    [excludes]="['class']"
    ><ng-container *ngTemplateOutlet="slot()"></ng-container
  ></ion-item>
</ng-template>
