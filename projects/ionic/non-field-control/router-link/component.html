<ng-template #templateRef let-attr="attributes">
  <ion-router-link
    [color]="color()"
    [href]="href()"
    [rel]="rel()"
    [routerDirection]="routerDirection()"
    [routerAnimation]="routerAnimation()"
    [target]="target()"
    [class]="attr()?.class"
    [attributes]="attr()"
    [excludes]="['class']"
    ><ng-container *ngTemplateOutlet="slot()"></ng-container
  ></ion-router-link>
</ng-template>
