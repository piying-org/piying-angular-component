<ng-template #templateRef let-attr="attributes">
  <ion-popover
    [component]="component()"
    [componentProps]="componentProps()"
    [keyboardClose]="keyboardClose()"
    [cssClass]="cssClass()"
    [backdropDismiss]="backdropDismiss()"
    [event]="event()"
    [showBackdrop]="showBackdrop()"
    [translucent]="translucent()"
    [animated]="animated()"
    [htmlAttributes]="htmlAttributes()"
    [triggerAction]="triggerAction()"
    [trigger]="trigger()"
    [size]="size()"
    [dismissOnSelect]="dismissOnSelect()"
    [reference]="reference()"
    [side]="side()"
    [alignment]="alignment()"
    [arrow]="arrow()"
    [isOpen]="isOpen()"
    [keyboardEvents]="keyboardEvents()"
    [focusTrap]="focusTrap()"
    [keepContentsMounted]="keepContentsMounted()"
    (ionPopoverDidPresent)="ionPopoverDidPresent($event)"
    (ionPopoverWillPresent)="ionPopoverWillPresent($event)"
    (ionPopoverWillDismiss)="ionPopoverWillDismiss($event)"
    (ionPopoverDidDismiss)="ionPopoverDidDismiss($event)"
    (didPresent)="didPresent($event)"
    (willPresent)="willPresent($event)"
    (willDismiss)="willDismiss($event)"
    (didDismiss)="didDismiss($event)"
    (ionMount)="ionMount($event)"
    [class]="attr()?.class"
    [attributes]="attr()"
    [excludes]="['class']"
    ><ng-container *ngTemplateOutlet="slot().default" ngProjectAs="default"></ng-container
  ></ion-popover>
</ng-template>
