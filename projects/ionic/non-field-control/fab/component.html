<ng-template #templateRef let-attr="attributes">
  <ion-fab
    [horizontal]="horizontal()"
    [vertical]="vertical()"
    [edge]="edge()"
    [activated]="activated()"
    (close)="close.emit($event)"
    (toggle)="toggle.emit($event)"
    [class]="attr()?.class"
    [attributes]="attr()"
    [excludes]="['class']"
    ><ng-container *ngTemplateOutlet="slot()"></ng-container
  ></ion-fab>
</ng-template>
