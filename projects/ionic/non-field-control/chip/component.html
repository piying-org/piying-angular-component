<ng-template #templateRef let-attr="attributes">
  <ion-chip
    [color]="color()"
    [outline]="outline()"
    [disabled]="disabled()"
    [class]="attr()?.class"
    [attributes]="attr()"
    [excludes]="['class']"
    ><ng-container *ngTemplateOutlet="slot()"></ng-container
  ></ion-chip>
</ng-template>
