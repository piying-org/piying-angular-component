<ng-template #templateRef let-attr="attributes">
  <ion-route
    [url]="url()"
    [component]="component()"
    [componentProps]="componentProps()"
    [beforeLeave]="beforeLeave()"
    [beforeEnter]="beforeEnter()"
    (ionRouteDataChanged)="ionRouteDataChanged.emit($event)"
    [class]="attr()?.class"
    [attributes]="attr()"
    [excludes]="['class']"
  ></ion-route>
</ng-template>
