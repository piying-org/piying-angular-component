<ng-template #templateRef let-attr="attributes">
  <ion-img
    [alt]="alt()"
    [src]="src()"
    (ionImgWillLoad)="ionImgWillLoad($event)"
    (ionImgDidLoad)="ionImgDidLoad($event)"
    (ionError)="ionError($event)"
    [class]="attr()?.class"
    [attributes]="attr()"
    [excludes]="['class']"
  ></ion-img>
</ng-template>
