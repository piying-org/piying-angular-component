<ng-template #templateRef let-attr="attributes">
  <ion-app
    [el]="el()"
    (componentDidLoad)="componentDidLoad.emit($event)"
    (disconnectedCallback)="disconnectedCallback.emit($event)"
    [class]="attr()?.class"
    [attributes]="attr()"
    [excludes]="['class']"
    ><ng-container *ngTemplateOutlet="slot()"></ng-container
  ></ion-app>
</ng-template>
