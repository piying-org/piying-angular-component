<ng-template #templateRef let-attr="attributes">
  <ion-datetime-button
    [color]="color()"
    [disabled]="disabled()"
    [datetime]="datetime()"
    (ionValueChange)="ionValueChange.emit($event)"
    (ionChange)="ionChange.emit($event)"
    [class]="attr()?.class"
    [attributes]="attr()"
    [excludes]="['class']"
    ><ng-container *ngTemplateOutlet="slot()"></ng-container>
    <ng-container *ngTemplateOutlet="slot()"></ng-container
  ></ion-datetime-button>
</ng-template>
