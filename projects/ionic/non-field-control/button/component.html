<ng-template #templateRef let-attr="attributes">
  <ion-button
    [color]="color()"
    [buttonType]="buttonType()"
    [disabled]="disabled() || isLoading$()"
    [expand]="expand()"
    [fill]="fill()"
    [routerDirection]="routerDirection()"
    [routerAnimation]="routerAnimation()"
    [download]="download()"
    [href]="href()"
    [rel]="rel()"
    [shape]="shape()"
    [size]="size()"
    [strong]="strong()"
    [target]="target()"
    [type]="type()"
    [form]="form()"
    (ionFocus)="ionFocus.emit($event)"
    (ionBlur)="ionBlur.emit($event)"
    [class]="attr()?.class"
    [attributes]="attr()"
    [excludes]="['class']"
    (click)="onClick($event)"
  >
    <ng-container *ngTemplateOutlet="slot()"></ng-container>

    @if (icon() && !content()) {
      <ng-template
        [selectlessOutlet]="StrOrTemplateComponent"
        [selectlessOutletInputs]="{ content: icon() }"
      ></ng-template>
    } @else {
      @if (content()) {
        <ng-template
          [selectlessOutlet]="StrOrTemplateComponent"
          [selectlessOutletInputs]="{ content: content() }"
        ></ng-template>
      }
      @if (start()) {
        @if (isLoading$()) {
          <ion-spinner slot="start" class="w-[1em] h-[1em]"></ion-spinner>
        } @else {
          <ng-template
            [selectlessOutlet]="StrOrTemplateComponent"
            [selectlessOutletInputs]="{ content: start() }"
          ></ng-template>
        }
      }
      @if (end()) {
        @if (isLoading$()) {
          <ion-spinner slot="end" class="w-[1em] h-[1em]"></ion-spinner>
        } @else {
          <ng-template
            [selectlessOutlet]="StrOrTemplateComponent"
            [selectlessOutletInputs]="{ content: end() }"
          ></ng-template>
        }
      }
    }
  </ion-button>
</ng-template>
