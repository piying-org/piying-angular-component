<ng-template #templateRef let-attr="attributes">
  <ion-segment-view
    [disabled]="disabled()"
    [swipeGesture]="swipeGesture()"
    (ionSegmentViewScroll)="ionSegmentViewScroll.emit($event)"
    [class]="attr()?.class"
    [attributes]="attr()"
    [excludes]="['class']"
    ><ng-container *ngTemplateOutlet="slot()"></ng-container
  ></ion-segment-view>
</ng-template>
