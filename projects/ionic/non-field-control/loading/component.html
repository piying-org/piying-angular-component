<ng-template #templateRef let-attr="attributes">
  <ion-loading
    [overlayIndex]="overlayIndex()"
    [delegate]="delegate()"
    [hasController]="hasController()"
    [keyboardClose]="keyboardClose()"
    [enterAnimation]="enterAnimation()"
    [leaveAnimation]="leaveAnimation()"
    [message]="message()"
    [cssClass]="cssClass()"
    [duration]="duration()"
    [backdropDismiss]="backdropDismiss()"
    [showBackdrop]="showBackdrop()"
    [spinner]="spinner()"
    [translucent]="translucent()"
    [animated]="animated()"
    [htmlAttributes]="htmlAttributes()"
    [isOpen]="isOpen()"
    [trigger]="trigger()"
    (ionLoadingWillPresent)="ionLoadingWillPresent($event)"
    (ionLoadingWillDismiss)="ionLoadingWillDismiss($event)"
    (ionLoadingDidDismiss)="ionLoadingDidDismiss($event)"
    (didPresent)="didPresent($event)"
    (willPresent)="willPresent($event)"
    (willDismiss)="willDismiss($event)"
    (didDismiss)="didDismiss($event)"
    [class]="attr()?.class"
    [attributes]="attr()"
    [excludes]="['class']"
  ></ion-loading>
</ng-template>
