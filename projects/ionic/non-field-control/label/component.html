<ng-template #templateRef let-attr="attributes">
  <ion-label
    [color]="color()"
    [position]="position()"
    (ionColor)="ionColor($event)"
    (ionStyle)="ionStyle($event)"
    [class]="attr()?.class"
    [attributes]="attr()"
    [excludes]="['class']"
    ><ng-container *ngTemplateOutlet="slot().default" ngProjectAs="default"></ng-container
  ></ion-label>
</ng-template>
