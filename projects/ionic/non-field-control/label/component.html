<ng-template #templateRef let-attr="attributes">
  <ion-label
    [color]="color()"
    [position]="position()"
    (ionColor)="ionColor.emit($event)"
    (ionStyle)="ionStyle.emit($event)"
    [class]="attr()?.class"
    [attributes]="attr()"
    [excludes]="['class']"
    ><ng-container *ngTemplateOutlet="slot()"></ng-container
  ></ion-label>
</ng-template>
