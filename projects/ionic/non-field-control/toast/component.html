<ng-template #templateRef let-attr="attributes">
  <ion-toast
    [color]="color()"
    [enterAnimation]="enterAnimation()"
    [leaveAnimation]="leaveAnimation()"
    [cssClass]="cssClass()"
    [duration]="duration()"
    [header]="header()"
    [message]="message()"
    [keyboardClose]="keyboardClose()"
    [position]="position()"
    [positionAnchor]="positionAnchor()"
    [buttons]="buttons()"
    [translucent]="translucent()"
    [animated]="animated()"
    [icon]="icon()"
    [htmlAttributes]="htmlAttributes()"
    [swipeGesture]="swipeGesture()"
    [isOpen]="isOpen()"
    [trigger]="trigger()"
    (ionToastDidPresent)="ionToastDidPresent.emit($event)"
    (ionToastWillPresent)="ionToastWillPresent.emit($event)"
    (ionToastWillDismiss)="ionToastWillDismiss.emit($event)"
    (ionToastDidDismiss)="ionToastDidDismiss.emit($event)"
    [class]="attr()?.class"
    [attributes]="attr()"
    [excludes]="['class']"
  ></ion-toast>
</ng-template>
