<ng-template #templateRef let-attr="attributes">
  <ion-alert
    [overlayIndex]="overlayIndex()"
    [delegate]="delegate()"
    [hasController]="hasController()"
    [keyboardClose]="keyboardClose()"
    [enterAnimation]="enterAnimation()"
    [leaveAnimation]="leaveAnimation()"
    [cssClass]="cssClass()"
    [header]="header()"
    [subHeader]="subHeader()"
    [message]="message()"
    [buttons]="buttons()"
    [inputs]="inputs()"
    [backdropDismiss]="backdropDismiss()"
    [translucent]="translucent()"
    [animated]="animated()"
    [htmlAttributes]="htmlAttributes()"
    [isOpen]="isOpen()"
    [trigger]="trigger()"
    (ionAlertDidPresent)="ionAlertDidPresent.emit($event)"
    (ionAlertWillPresent)="ionAlertWillPresent.emit($event)"
    (ionAlertWillDismiss)="ionAlertWillDismiss.emit($event)"
    (ionAlertDidDismiss)="ionAlertDidDismiss.emit($event)"
    (didPresent)="didPresent.emit($event)"
    (willPresent)="willPresent.emit($event)"
    (willDismiss)="willDismiss.emit($event)"
    (didDismiss)="didDismiss.emit($event)"
    [class]="attr()?.class"
    [attributes]="attr()"
    [excludes]="['class']"
  ></ion-alert>
</ng-template>
