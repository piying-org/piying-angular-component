<ng-template #templateRef let-attr="attributes">
  <ion-segment
    [color]="color()"
    [disabled]="disabled()"
    [scrollable]="scrollable()"
    [swipeGesture]="swipeGesture()"
    [value]="value()"
    [selectOnFocus]="selectOnFocus()"
    (ionChange)="ionChange.emit($event)"
    (ionSelect)="ionSelect.emit($event)"
    (ionStyle)="ionStyle.emit($event)"
    [class]="attr()?.class"
    [attributes]="attr()"
    [excludes]="['class']"
    ><ng-container *ngTemplateOutlet="slot()?.default" ngProjectAs="default"></ng-container
  ></ion-segment>
</ng-template>
