<ng-template #templateRef let-attr="attributes">
  <ion-tabs
    [useRouter]="useRouter()"
    (ionNavWillLoad)="ionNavWillLoad.emit($event)"
    (ionTabsWillChange)="ionTabsWillChange.emit($event)"
    (ionTabsDidChange)="ionTabsDidChange.emit($event)"
    [class]="attr()?.class"
    [attributes]="attr()"
    [excludes]="['class']"
    ><ng-container *ngTemplateOutlet="slot()?.top" ngProjectAs="top"></ng-container>
    <ng-container *ngTemplateOutlet="slot()?.bottom" ngProjectAs="bottom"></ng-container
  ></ion-tabs>
</ng-template>
