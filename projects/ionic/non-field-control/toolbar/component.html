<ng-template #templateRef let-attr="attributes">
  <ion-toolbar
    [color]="color()"
    [class]="attr()?.class"
    [attributes]="attr()"
    [excludes]="['class']"
    ><ng-container *ngTemplateOutlet="slot()?.start" ngProjectAs="start"></ng-container>
    <ng-container *ngTemplateOutlet="slot()?.secondary" ngProjectAs="secondary"></ng-container>
    <ng-container *ngTemplateOutlet="slot()?.primary" ngProjectAs="primary"></ng-container>
    <ng-container *ngTemplateOutlet="slot()?.end" ngProjectAs="end"></ng-container
  ></ion-toolbar>
</ng-template>
