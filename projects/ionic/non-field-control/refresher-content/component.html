<ng-template #templateRef let-attr="attributes">
  <ion-refresher-content
    [pullingIcon]="pullingIcon()"
    [pullingText]="pullingText()"
    [refreshingSpinner]="refreshingSpinner()"
    [refreshingText]="refreshingText()"
    [class]="attr()?.class"
    [attributes]="attr()"
    [excludes]="['class']"
  ></ion-refresher-content>
</ng-template>
