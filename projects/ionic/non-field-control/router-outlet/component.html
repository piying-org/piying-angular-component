<ng-template #templateRef let-attr="attributes">
  <ion-router-outlet
    [mode]="mode()"
    [delegate]="delegate()"
    [animated]="animated()"
    [animation]="animation()"
    [swipeHandler]="swipeHandler()"
    (ionNavWillLoad)="ionNavWillLoad.emit($event)"
    (ionNavWillChange)="ionNavWillChange.emit($event)"
    (ionNavDidChange)="ionNavDidChange.emit($event)"
    [class]="attr()?.class"
    [attributes]="attr()"
    [excludes]="['class']"
    ><ng-container *ngTemplateOutlet="slot()"></ng-container
  ></ion-router-outlet>
</ng-template>
