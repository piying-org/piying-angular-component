<ng-template #templateRef let-attr="attributes">
  <ion-action-sheet
    [overlayIndex]="overlayIndex()"
    [delegate]="delegate()"
    [hasController]="hasController()"
    [keyboardClose]="keyboardClose()"
    [enterAnimation]="enterAnimation()"
    [leaveAnimation]="leaveAnimation()"
    [buttons]="buttons()"
    [cssClass]="cssClass()"
    [backdropDismiss]="backdropDismiss()"
    [header]="header()"
    [subHeader]="subHeader()"
    [translucent]="translucent()"
    [animated]="animated()"
    [htmlAttributes]="htmlAttributes()"
    [isOpen]="isOpen()"
    [trigger]="trigger()"
    (ionActionSheetDidPresent)="ionActionSheetDidPresent.emit($event)"
    (ionActionSheetWillDismiss)="ionActionSheetWillDismiss.emit($event)"
    (ionActionSheetDidDismiss)="ionActionSheetDidDismiss.emit($event)"
    (didPresent)="didPresent.emit($event)"
    (willPresent)="willPresent.emit($event)"
    (willDismiss)="willDismiss.emit($event)"
    (didDismiss)="didDismiss.emit($event)"
    [class]="attr()?.class"
    [attributes]="attr()"
    [excludes]="['class']"
  ></ion-action-sheet>
</ng-template>
