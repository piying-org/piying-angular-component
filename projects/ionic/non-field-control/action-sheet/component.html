<ng-template #templateRef let-attr="attributes">
  <ion-action-sheet
    [overlayIndex]="overlayIndex()"
    [delegate]="delegate()"
    [hasController]="hasController()"
    [keyboardClose]="keyboardClose()"
    [enterAnimation]="enterAnimation()"
    [leaveAnimation]="leaveAnimation()"
    [buttons]="buttons()"
    [cssClass]="cssClass()"
    [backdropDismiss]="backdropDismiss()"
    [header]="header()"
    [subHeader]="subHeader()"
    [translucent]="translucent()"
    [animated]="animated()"
    [htmlAttributes]="htmlAttributes()"
    [isOpen]="isOpen()"
    [trigger]="trigger()"
    (ionActionSheetDidPresent)="ionActionSheetDidPresent($event)"
    (ionActionSheetWillDismiss)="ionActionSheetWillDismiss($event)"
    (ionActionSheetDidDismiss)="ionActionSheetDidDismiss($event)"
    (didPresent)="didPresent($event)"
    (willPresent)="willPresent($event)"
    (willDismiss)="willDismiss($event)"
    (didDismiss)="didDismiss($event)"
    [class]="attr()?.class"
    [attributes]="attr()"
    [excludes]="['class']"
  ></ion-action-sheet>
</ng-template>
