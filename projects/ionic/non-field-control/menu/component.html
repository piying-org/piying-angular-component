<ng-template #templateRef let-attr="attributes">
  <ion-menu
    [contentId]="contentId()"
    [menuId]="menuId()"
    [type]="type()"
    [disabled]="disabled()"
    [side]="side()"
    [swipeGesture]="swipeGesture()"
    [maxEdgeStart]="maxEdgeStart()"
    (ionWillOpen)="ionWillOpen.emit($event)"
    (ionWillClose)="ionWillClose.emit($event)"
    (ionDidOpen)="ionDidOpen.emit($event)"
    (ionDidClose)="ionDidClose.emit($event)"
    (ionMenuChange)="ionMenuChange.emit($event)"
    [class]="attr()?.class"
    [attributes]="attr()"
    [excludes]="['class']"
    ><ng-container *ngTemplateOutlet="slot()?.default" ngProjectAs="default"></ng-container
  ></ion-menu>
</ng-template>
