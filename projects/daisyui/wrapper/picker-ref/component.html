<ng-template #templateRef let-attr="attributes">
  <div
    cdkOverlayOrigin
    #trigger="cdkOverlayOrigin"
    [attributes]="attr()"
    (click)="openRef('click', $event)"
    (contextmenu)="openRef('contextmenu', $event)"
  >
    <ng-container insertField></ng-container>
  </div>

  <ng-template
    [cdkConnectedOverlayOrigin]="props$$().originSource === 'event' ? event$() : trigger"
    [cdkConnectedOverlayOpen]="isOpen$()"
    [cdkConnectedOverlay]="props$$().overlayConfig"
    (detach)="isOpen$.set(false)"
    (overlayOutsideClick)="outsideClick()"
    [menuTrigger]="menuTrigger"
  >
    <ng-container
      [selectlessOutlet]="PiyingView"
      [selectlessOutletInputs]="contentInput$$()"
    ></ng-container>
  </ng-template>
</ng-template>
