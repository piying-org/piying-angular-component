<ng-template #templateRef let-attr="attributes">
  <div
    cdkOverlayOrigin
    #trigger="cdkOverlayOrigin"
    [attributes]="attr()"
    (click)="openRef('click')"
    (contextmenu)="openRef('contextmenu')"
  >
    <ng-container
      [selectlessOutlet]="PiyingView"
      [selectlessOutletInputs]="triggerInput$$()"
    ></ng-container>
  </div>

  <ng-template
    [cdkConnectedOverlayOrigin]="trigger"
    [cdkConnectedOverlayOpen]="isOpen$()"
    [cdkConnectedOverlay]="overlayConfig()"
    (detach)="isOpen$.set(false)"
    (overlayOutsideClick)="outsideClick()"
    [menuTrigger]="menuTrigger"
    [changeClose]="changeClose()"
  >
    <ng-container
      [selectlessOutlet]="PiyingView"
      [selectlessOutletInputs]="contentInput$$()"
      [selectlessOutletOutputs]="contentOutput$$()"
    ></ng-container>
  </ng-template>
</ng-template>
