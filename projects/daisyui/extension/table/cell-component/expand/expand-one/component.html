<ng-template #templateRef let-attr="attributes">
  <span
    [class]="'material-icons cursor-pointer' | mergeClass: attr()?.class"
    [attributes]="attr()"
    [excludes]="['class']"
    (click)="toggle()"
  >
    @if (isExpand$$()) {
      keyboard_arrow_up
    } @else {
      keyboard_arrow_down
    }
  </span>
</ng-template>
