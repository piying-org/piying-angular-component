<ng-template #templateRef let-attr="attributes">
  <label [class]="'input' | mergeClass: attr().class">
    <input
      [type]="type$$()"
      [placeholder]="attr()?.placeholder ?? ''"
      [ngModel]="value$()"
      (ngModelChange)="valueChange($event)"
      (blur)="touchedChange()"
      class="w-full"
    />
    <button class="btn btn-circle btn-ghost btn-sm" type="button" (click)="toggleSee()">
      @if (see$()) {
        <span class="material-icons">remove_red_eye</span>
        <span class="absolute material-icons">not_interested</span>
      } @else {
        <span class="material-icons">remove_red_eye</span>
      }
    </button>
  </label>
</ng-template>
